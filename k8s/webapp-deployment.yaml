apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-intelligence-webapp
  labels:
    app: churn-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-webapp
  template:
    metadata:
      labels:
        app: churn-webapp
    spec:
      containers:
      - name: churn-webapp
        image: WEBAPP_IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8000
        env:
        - name: INFERENCE_API
          value: "http://churn-api-service:5000"
        - name: API_USER
          valueFrom:
            secretKeyRef:
              name: api-credentials
              key: username
        - name: API_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-credentials
              key: password
